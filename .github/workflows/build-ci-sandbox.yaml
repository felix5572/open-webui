name: Build Bleeding Edge Docker Image

on:
  push:
    branches:
      - ci-sandbox
  workflow_dispatch:       # Allow manual trigger

env:
  REGISTRY: docker.io
  DOCKERHUB_USERNAME: yfb222333
  IMAGE_NAME: yfb222333/open-webui

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Always tag as latest (keep most recent)
            type=raw,value=latest
            # Bleeding tag identifies this as bleeding edge version
            type=raw,value=bleeding
            # Git commit SHA for rollback and tracking
            type=sha,prefix=bleeding-{{date 'YYYYMMDD'}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64  # Multi-architecture support
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_HASH=${{ github.sha }}

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}